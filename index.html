<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Agent</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f1115;
            color: white;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .box {
            width: 100%;
            max-width: 800px;
            padding: 25px;
            border-radius: 16px;
            background: #181b21;
            border: 1px solid #2b3038;
        }

        h2 {
            margin-top: 0;
        }

        #userAgent {
            padding: 15px;
            border-radius: 10px;
            background: #0d0f13;
            border: 1px solid #292e36;
            word-break: break-all;
            line-height: 1.6;
        }
    </style>
</head>

<body>

<div class="box">
    <h2>USER_AGENT của bạn</h2>

    <div id="userAgent"></div>
</div>

<script>
    document.getElementById("userAgent").textContent =
        navigator.userAgent;
</script>

</body>
</html>
