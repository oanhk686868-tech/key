<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Xác Nhận Key Hệ Thống</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-1: #050816;
            --bg-2: #0b1220;
            --line: rgba(255, 255, 255, .10);
            --text: #f8fafc;
            --muted: #94a3b8;
            --accent: #7c3aed;
            --accent-2: #2563eb;
            --accent-3: #22c55e;
            --key: #38bdf8;
            --shadow: 0 30px 80px rgba(0, 0, 0, .45);
            --radius: 24px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: var(--text);
            min-height: 100vh;
            display: grid;
            place-items: center;
            background:
                radial-gradient(circle at top left, rgba(124, 58, 237, .18), transparent 35%),
                radial-gradient(circle at bottom right, rgba(37, 99, 235, .18), transparent 35%),
                linear-gradient(160deg, var(--bg-1), var(--bg-2));
            padding: 20px;
        }

        .bg-orb {
            position: fixed;
            width: 420px;
            height: 420px;
            border-radius: 50%;
            filter: blur(30px);
            opacity: .26;
            pointer-events: none;
            z-index: 0;
            animation: float 10s ease-in-out infinite;
        }

        .orb-1 { top: -140px; left: -120px; background: radial-gradient(circle, rgba(124, 58, 237, .9), transparent 65%); }
        .orb-2 { bottom: -160px; right: -140px; background: radial-gradient(circle, rgba(37, 99, 235, .9), transparent 65%); animation-delay: -3s; }

        .grid {
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: .12;
            z-index: 0;
            background-image:
                linear-gradient(rgba(255, 255, 255, .08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, .08) 1px, transparent 1px);
            background-size: 64px 64px;
            mask-image: radial-gradient(circle at center, black 35%, transparent 85%);
        }

        .wrap {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
        }

        .card {
            position: relative;
            overflow: hidden;
            border-radius: var(--radius);
            background: linear-gradient(180deg, rgba(15, 23, 42, .78), rgba(15, 23, 42, .58));
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            border: 1px solid rgba(255, 255, 255, .12);
            box-shadow: var(--shadow);
            padding: 28px 24px 20px;
            animation: fadeUp .6s ease both;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 20px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-badge {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            box-shadow: 0 10px 24px rgba(37, 99, 235, .28);
            flex: 0 0 auto;
        }

        .brand-badge svg {
            width: 22px;
            height: 22px;
            stroke: #fff;
            fill: none;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        h1 {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -.02em;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 999px;
            background: rgba(34, 197, 94, .12);
            border: 1px solid rgba(34, 197, 94, .24);
            color: #bbf7d0;
            font-size: 12px;
            font-weight: 700;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 999px;
            background: var(--accent-3);
        }

        .panel {
            border-radius: 18px;
            background: rgba(30, 41, 59, .5);
            border: 1px solid var(--line);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .key-box {
            padding: 16px;
            border-radius: 14px;
            background: rgba(2, 6, 23, .7);
            border: 1px solid rgba(255, 255, 255, .08);
            text-align: center;
        }

        .key-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: .12em;
            color: var(--muted);
            margin-bottom: 6px;
            font-weight: 700;
        }

        .key-value {
            font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
            font-size: clamp(20px, 4.5vw, 26px);
            font-weight: 800;
            letter-spacing: .1em;
            color: var(--key);
            word-break: break-all;
            user-select: all;
        }

        .key-value.empty {
            font-family: inherit;
            font-size: 14px;
            color: #fda4af;
            letter-spacing: 0;
            user-select: none;
        }

        .info-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            background: rgba(15, 23, 42, 0.4);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 13px;
        }

        .info-label {
            color: var(--muted);
            font-weight: 600;
        }

        .info-value {
            color: var(--text);
            font-weight: 700;
            font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
        }

        .btn-copy {
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            color: white;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 10px 24px rgba(37, 99, 235, .28);
            transition: transform .18s ease, filter .18s ease;
            margin-top: 4px;
        }

        .btn-copy:hover {
            transform: translateY(-2px);
            filter: brightness(1.08);
        }

        .btn-copy:disabled {
            cursor: not-allowed;
            opacity: .5;
            transform: none;
            box-shadow: none;
        }

        .btn-copy svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
        }

        .footer {
            margin-top: 16px;
            text-align: center;
            color: var(--muted);
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.05em;
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 24px;
            transform: translateX(-50%) translateY(20px);
            opacity: 0;
            pointer-events: none;
            z-index: 10;
            background: rgba(15, 23, 42, .95);
            border: 1px solid rgba(255, 255, 255, .12);
            box-shadow: 0 16px 40px rgba(0, 0, 0, .35);
            color: #fff;
            padding: 10px 18px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all .28s ease;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(14px); }
        }
    </style>
</head>
<body>
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>
    <div class="grid"></div>

    <main class="wrap">
        <section class="card">
            <div class="topbar">
                <div class="brand">
                    <div class="brand-badge">
                        <svg viewBox="0 0 24 24">
                            <path d="M10 13a5 5 0 1 1 7.071-7.071 5 5 0 0 1-7.071 7.071Z"></path>
                            <path d="M7 17l-4 4"></path>
                            <path d="M12 8l4 4"></path>
                        </svg>
                    </div>
                    <h1>Xác Nhận Key</h1>
                </div>
                <div class="status">
                    <span class="status-dot"></span>
                    <span id="statusText">Hệ thống</span>
                </div>
            </div>

            <div class="panel">
                <div class="key-box">
                    <div class="key-label">MÃ KEY HỆ THỐNG</div>
                    <span id="keyDisplay" class="key-value">Đang tải...</span>
                </div>

                <div class="info-row" id="timeRow" style="display: none;">
                    <span class="info-label">Thời hạn Key:</span>
                    <span id="timeDisplay" class="info-value">--:--</span>
                </div>

                <div class="info-row" id="deviceRow" style="display: none;">
                    <span class="info-label">Số thiết bị:</span>
                    <span id="deviceDisplay" class="info-value">--</span>
                </div>

                <button class="btn-copy" id="copyBtn" type="button" onclick="copyKey()">
                    <svg viewBox="0 0 24 24">
                        <rect x="9" y="9" width="13" height="13" rx="2"></rect>
                        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                    </svg>
                    Sao Chép Key
                </button>
            </div>

            <div class="footer">
                cre tlvm
            </div>
        </section>
    </main>

    <div id="toast" class="toast">
        <span>✓</span>
        <span id="toastText">Đã sao chép key!</span>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const keyParam = (urlParams.get('key') || '').trim();
        const timeParam = (urlParams.get('time') || '').trim();
        const deviceParam = (urlParams.get('device') || '').trim();

        const keyDisplay = document.getElementById('keyDisplay');
        const copyBtn = document.getElementById('copyBtn');
        const timeRow = document.getElementById('timeRow');
        const timeDisplay = document.getElementById('timeDisplay');
        const deviceRow = document.getElementById('deviceRow');
        const deviceDisplay = document.getElementById('deviceDisplay');
        const statusText = document.getElementById('statusText');
        const toast = document.getElementById('toast');

        // Hiển thị Key (?key=...)
        if (keyParam) {
            keyDisplay.textContent = keyParam;
            keyDisplay.classList.remove('empty');
            copyBtn.disabled = false;
            statusText.textContent = 'Hợp lệ';
        } else {
            keyDisplay.textContent = 'Thiếu tham số ?key=';
            keyDisplay.classList.add('empty');
            copyBtn.disabled = true;
            statusText.textContent = 'Không có key';
        }

        // Hiển thị Time (?time=2026:12:30:12:31)
        if (timeParam) {
            const parts = timeParam.split(':');
            if (parts.length === 5) {
                const [year, month, day, hour, minute] = parts;
                timeDisplay.textContent = `${hour}:${minute} - ${day}/${month}/${year}`;
            } else {
                timeDisplay.textContent = timeParam;
            }
            timeRow.style.display = 'flex';
        }

        // Hiển thị Số Thiết Bị (?device=1)
        if (deviceParam) {
            deviceDisplay.textContent = `${deviceParam} thiết bị`;
            deviceRow.style.display = 'flex';
        }

        async function copyKey() {
            if (!keyParam) return;
            try {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(keyParam);
                } else {
                    const textArea = document.createElement('textarea');
                    textArea.value = keyParam;
                    textArea.style.position = 'fixed';
                    textArea.style.left = '-9999px';
                    document.body.appendChild(textArea);
                    textArea.focus();
                    textArea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textArea);
                }
                showToast('Đã sao chép key thành công!');
            } catch (err) {
                showToast('Sao chép thất bại!');
            }
        }

        let toastTimer;
        function showToast(msg) {
            document.getElementById('toastText').textContent = msg;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
        }
    </script>
</body>
</html>
